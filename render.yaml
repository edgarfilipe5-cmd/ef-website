services:
  - type: web
    name: ef-website
    runtime: static
    repo: https://github.com/edgarfilipe5-cmd/ef-website.git
    branch: main
    buildCommand: npm run build
    staticPublishPath: ./dist
    previews:
      generation: automatic
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
