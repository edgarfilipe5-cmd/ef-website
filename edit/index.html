<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#000000">
  <title>EF — Editor Criativo</title>
  <style>
    :root{--gold:#D4AF37;--black:#000;--white:#fff;--grey:#A7A7A7}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#080808;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);border:1px solid #2c2c2c;background:#101010;padding:42px}
    .tag{color:var(--gold);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
    h1{font-size:clamp(2.5rem,7vw,5.5rem);line-height:.92;letter-spacing:-.05em;margin:18px 0}
    p{color:#c7c7c2;line-height:1.6;font-size:1.05rem}.note{font-size:.9rem;color:#92928d;border-top:1px solid #2f2f2f;padding-top:20px;margin-top:24px}
    .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{display:inline-flex;text-decoration:none;font-weight:900;padding:15px 18px;border:1px solid #fff;color:#fff}.btn.primary{background:var(--gold);border-color:var(--gold);color:#000}
  </style>
</head>
<body>
  <main>
    <div class="tag">EF · Área criativa</div>
    <h1>Editor do website EF.</h1>
    <p>Área reservada para edição de textos, fotografias e vídeos do website. O acesso às alterações é controlado pelo Pages CMS.</p>
    <div class="buttons">
      <a class="btn primary" href="https://app.pagescms.org/edgarfilipe5-cmd/ef-website/main/file/website">Abrir editor</a>
      <a class="btn" href="https://ef-website.onrender.com">Ver site público</a>
    </div>
    <p class="note">Se não estiveres autorizada como colaboradora, o editor não permitirá alterar o conteúdo.</p>
  </main>
</body>
</html>
